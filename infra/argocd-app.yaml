# ArgoCD Application that syncs apps/demo-app/ from this repo's main branch.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/allangelman/k8s-remediation-agent.git
    targetRevision: main
    path: apps/demo-app
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      # selfHeal is off on purpose: manual changes to the cluster should stay
      # visible (OutOfSync) so the agent can detect and reason about drift.
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
